# Runs the cross-poster in the cloud for free on GitHub Actions.
# All settings/tokens come from repo secrets (upload them with: gh secret set -f .env)
name: crosspost

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for testing

permissions:
  contents: write             # to save state.json back to the repo

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check TikTok and cross-post
        run: python crosspost.py --once
        env:
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          POST_TO: ${{ secrets.POST_TO }}
          EXTRA_HASHTAGS: ${{ secrets.EXTRA_HASHTAGS }}
          DEFAULT_TITLE: ${{ secrets.DEFAULT_TITLE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ secrets.YT_PRIVACY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - name: Save state.json
        if: always()
        run: |
          git config user.name "crosspost-bot"
          git config user.email "crosspost-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "update state [skip ci]" && git push)
